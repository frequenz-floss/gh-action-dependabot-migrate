---
name: CI

on:
  merge_group:
  push:
    # We need to explicitly include tags because otherwise when adding
    # `branches-ignore` it will only trigger on branches.
    tags:
      - '*'
    branches-ignore:
      # Ignore pushes to merge queues.
      # We only want to test the merge commit (`merge_group` event), the hashes
      # in the push were already tested by the PR checks
      - 'gh-readonly-queue/**'
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ═══════════════════════════════════════════════════════════════════
jobs:
  # ═══════════════════════════════════════════════════════════════════
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-slim
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run ShellCheck with reviewdog
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e  # v1.32.0
        with:
          reporter: "github-check"
          filter_mode: "nofilter"
          fail_level: "any"
          path: "."
          pattern: "*.sh"

  # ═══════════════════════════════════════════════════════════════════
  actionlint:
    name: Actionlint
    # We can't use ubuntu-slim because it needs docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # actionlint validates workflow files only.
      # action.yml is covered by yamllint in the yamllint job.
      - name: Run actionlint with reviewdog
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e  # v1.73.0
        with:
          reporter: "github-check"
          filter_mode: "nofilter"
          fail_level: "any"
          actionlint_flags: ".github/workflows/"

  # ═══════════════════════════════════════════════════════════════════
  yamllint:
    name: Yamllint
    # We can't use ubuntu-slim because it needs docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run yamllint with reviewdog
        uses: reviewdog/action-yamllint@b5f7217d8c815ae374d1d55840d5e569d82f01f0  # v1.22.0
        with:
          reporter: "github-check"
          filter_mode: "nofilter"
          fail_level: "any"
          yamllint_flags: >-
            -c .yamllint.yaml
            .github/workflows/
            .github/dependabot.yml
            action.yml
            .yamllint.yaml

  # ═══════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: "recursive"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Run unit tests
        run: tests/lib/bats-core/bin/bats tests/ --print-output-on-failure

  # ═══════════════════════════════════════════════════════════════════
  integration-test:
    name: Integration test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Verify that auto-merge-on-changes=true without a token is
      # rejected by the validate-inputs step (step 1 of the action).
      - name: Test validate-inputs rejects missing token
        id: test-missing-token
        continue-on-error: true
        uses: ./
        with:
          script-url-template: "https://example.com/{version}.py"
          auto-merge-on-changes: "true"
          token: ""

      - name: Assert validation failure
        env:
          OUTCOME: ${{ steps.test-missing-token.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected action to fail when auto-merge-on-changes=true without token."
            exit 1
          fi
          echo "Validation correctly rejected missing token."
